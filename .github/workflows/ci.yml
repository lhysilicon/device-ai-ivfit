name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        run: pip install -r requirements.txt
      - name: make all
        run: make all
